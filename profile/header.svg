<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Juan Carvalho (jcx3r), front-end developer building web apps, dashboards and landing pages">
  <title>Juan Carvalho (jcx3r), front-end developer building web apps, dashboards and landing pages</title>
  <defs>
    <pattern id="pontos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#FFFFFF"/>
    </pattern>
    <linearGradient id="esmaece" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0.25" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <mask id="metade">
      <rect width="1200" height="320" fill="url(#esmaece)"/>
    </mask>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="12" fill="#0A0A0A" stroke="#262626"/>
  <rect x="1" y="1" width="1198" height="318" rx="12" fill="url(#pontos)" opacity="0.09" mask="url(#metade)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16px" fill="#737373">
    <text x="64" y="76">~/jcx3r</text>
    <text x="64" y="288">based in Brazil · UTC−3 · EN / PT</text>
  </g>

  <text x="60" y="166" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76px" font-weight="800" letter-spacing="-2.5" fill="#FAFAFA">Juan Carvalho</text>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21px" fill="#A3A3A3">
    <text x="64" y="224">Front-end developer building web apps,</text>
    <text x="64" y="252">dashboards and landing pages.</text>
  </g>

  <g transform="translate(700 56)">
    <rect x="0.5" y="0.5" width="439" height="207" rx="10" fill="#111111" stroke="#262626"/>
    <line x1="1" y1="34" x2="439" y2="34" stroke="#262626"/>
    <circle cx="20" cy="17" r="5" fill="#262626"/>
    <circle cx="38" cy="17" r="5" fill="#262626"/>
    <circle cx="56" cy="17" r="5" fill="#262626"/>
    <text x="220" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" fill="#525252">zsh</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15px">
      <text x="24" y="64"><tspan fill="#737373">$ </tspan><tspan fill="#FAFAFA">whoami</tspan></text>
      <text x="24" y="88" fill="#A3A3A3">jcx3r, front-end developer</text>
      <text x="24" y="118"><tspan fill="#737373">$ </tspan><tspan fill="#FAFAFA">cat stack.txt</tspan></text>
      <text x="24" y="142" fill="#A3A3A3">react · typescript · next.js · tailwind</text>
      <text x="24" y="172"><tspan fill="#737373">$ </tspan><tspan fill="#FAFAFA">status</tspan></text>
      <text x="24" y="196" fill="#A3A3A3">open for commissions &amp; roles <tspan fill="#FAFAFA">█<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
    </g>
  </g>
</svg>
